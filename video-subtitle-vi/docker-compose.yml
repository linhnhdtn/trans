services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    user: "${UID:-1000}:${GID:-1000}"   # file trong data/ thuộc user máy host, không bị khóa root
    volumes:
      - ./data:/data        # video, phụ đề, kết quả
      - ./models:/models    # cache model Whisper (~3 GB với large-v3)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Chỉ bật khi TRANSLATOR=ollama (dịch nội bộ, dữ liệu không ra ngoài)
  # docker compose --profile local-llm up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ./ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
